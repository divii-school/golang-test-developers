name: verify
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...
      - run: go test ./... -v
      - run: docker build -t submission .
